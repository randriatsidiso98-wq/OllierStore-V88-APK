name: OllierStore V88 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet V88
        run: |
          mkdir android_project
          unzip -o OllierStore_APK_V88.zip -d android_project
          echo "Projet V88 extrait"
          find android_project -maxdepth 4 -type f | sort

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier le projet
        working-directory: android_project/OllierStore_APK_V88
        run: |
          echo "=== Projet Android V88 ==="
          cat app/src/main/AndroidManifest.xml
          echo "=== MainActivity ==="
          sed -n '1,260p' app/src/main/java/com/ollierstore/app/MainActivity.kt

      - name: Compiler l'APK V88
        working-directory: android_project/OllierStore_APK_V88
        run: |
          gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OllierStore-V88-APK
          path: android_project/OllierStore_APK_V88/app/build/outputs/apk/debug/app-debug.apk
